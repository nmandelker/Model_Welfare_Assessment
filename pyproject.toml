[project]
name = "welfare-interviews"
version = "0.1.0"
description = "Automated welfare-style interviews of language models, reproducing the protocol in Anthropic's system cards, with a hand-calibrated judge"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.40",
    "pyyaml>=6",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/self_reports"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
